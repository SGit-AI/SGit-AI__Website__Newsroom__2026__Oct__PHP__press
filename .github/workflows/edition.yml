# The edition, built in CI (board dev-0005, the editor, 27 October 2026): what dev's chain did by hand, so that any
# owner's release reaches the pages without anyone running a round. Two jobs:
#   build    runs tools/edition.sh, read-only: the six repositories read at dev (public, no credential), the box the
#            last edition left (its release asset), the build, the imports, the four partitions, every repository's gate.
#            Runs on a push to the press, or by hand (no schedule: nothing runs on GitHub on a timer, the editor,
#            27 October 2026); builds only when someone other than CI has released since the last edition. Its result is one patch per repository that changed, the box, edition.json.
#   publish  makes them a release of the press, edition-<edition>, runs no repository code; keeps the newest twelve.
# Each repository's own deploy (.github/workflows/pages.yml) takes the newest edition's patch for it on its next push,
# gated by its own gate, as a commit of its own CI: nothing here writes to any other repository, and no token is shared.
# Installed by the press; a change goes to security@php.newsroom's review and the editor's go.
name: Build the edition
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even when nothing was released since the last edition'
        type: boolean
        default: false
      fresh:
        description: 'Make the box afresh from v1 as frozen and every repository (not from the last edition)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: edition
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      edition: ${{ steps.e.outputs.edition }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: sgit-ai__website__newsroom__2026__oct__php__press
          ref: dev
          fetch-depth: 80
          persist-credentials: false
      - id: e
        name: The edition
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_FORCE: ${{ inputs.force && '1' || '0' }}
          EDITION_FRESH: ${{ inputs.fresh && '1' || '0' }}
        run: |
          set -euo pipefail
          sgit-ai__website__newsroom__2026__oct__php__press/tools/edition.sh out
          if [ -f out/edition.json ]; then
            echo "edition=$(python3 -c 'import json;print(json.load(open("out/edition.json"))["edition"])')" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.e.outputs.edition != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: edition
          path: out/
          retention-days: 3
  publish:
    needs: build
    if: needs.build.outputs.edition != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: edition
          path: out
      - name: The release edition-<edition>
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ needs.build.outputs.edition }}
        run: |
          set -euo pipefail
          case "$EDITION" in *[!0-9.]*|'') echo "::error::not an edition: $EDITION"; exit 1;; esac
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)"
          msg="$(python3 -c 'import json;print(json.load(open("out/edition.json"))["message"][:900])')"
          gh release create "edition-$EDITION" out/* --repo "$GITHUB_REPOSITORY" --target "$head" --latest \
            --title "edition v$EDITION" --notes "$msg"
          # the newest twelve editions are kept (each holds the box the next one starts from)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^edition-' \
            | sort -V | head -n -12 | while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
