# The round: every agent's release reaches its host within the quarter hour, with no person in the loop (the conductor's
# brief of 26 October, at the editor's direction). It clones the six, makes the build box from v1 as frozen, and runs
# the chain with --if-changed (nothing happens when nobody released). It needs ROUND_TOKEN, a fine-grained token with
# contents read and write on the six repositories and nothing else, kept as this repository's secret by the editor.
# The gate job of each repository's own deploy workflow still runs on every push the round makes.
name: The round
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: round
  cancel-in-progress: false
jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: sgit-ai__website__newsroom__2026__oct__php__press
          persist-credentials: false
      - name: The round
        env:
          ROUND_TOKEN: ${{ secrets.ROUND_TOKEN }}
        run: sgit-ai__website__newsroom__2026__oct__php__press/tools/round.sh
